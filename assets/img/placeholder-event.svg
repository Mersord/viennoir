<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Platzhalter für eine Eventaufnahme</title>
  <desc id="desc">Abstrakter eleganter Veranstaltungsraum mit warmen Lichtern.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#080609"/>
      <stop offset=".48" stop-color="#30101e"/>
      <stop offset="1" stop-color="#171025"/>
    </linearGradient>
    <radialGradient id="light" cx="50%" cy="35%" r="66%">
      <stop offset="0" stop-color="#ffdca0" stop-opacity=".5"/>
      <stop offset=".4" stop-color="#d57575" stop-opacity=".18"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="25"/></filter>
    <pattern id="grain" width="180" height="180" patternUnits="userSpaceOnUse">
      <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/></filter>
      <rect width="180" height="180" filter="url(#noise)" opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1600" height="1100" fill="url(#bg)"/>
  <rect width="1600" height="1100" fill="url(#light)"/>
  <g fill="#f7dca3" opacity=".45" filter="url(#blur)">
    <circle cx="275" cy="240" r="78"/><circle cx="540" cy="180" r="50"/><circle cx="810" cy="280" r="94"/>
    <circle cx="1110" cy="165" r="61"/><circle cx="1370" cy="270" r="84"/>
  </g>
  <g fill="none" stroke="#d7b768" stroke-width="3" opacity=".3">
    <path d="M240 1100V450h1120v650"/>
    <path d="M380 1100V570h840v530"/>
    <ellipse cx="800" cy="760" rx="380" ry="105"/>
  </g>
  <g fill="#f4e9dc" opacity=".17">
    <circle cx="520" cy="780" r="86"/><circle cx="800" cy="760" r="116"/><circle cx="1080" cy="780" r="86"/>
  </g>
  <rect width="1600" height="1100" fill="url(#grain)"/>
  <g fill="#f2e9df" text-anchor="middle">
    <text x="800" y="975" font-family="Georgia,serif" font-size="34" letter-spacing="9" opacity=".72">IMAGE PLACEHOLDER</text>
    <text x="800" y="1023" font-family="Arial,sans-serif" font-size="16" letter-spacing="5" opacity=".45">EVENT- ODER HOCHZEITSFOTO EINFÜGEN</text>
  </g>
</svg>
