<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Platzhalter für eine Bühnenaufnahme</title>
  <desc id="desc">Abstrakte dunkle Bühne mit Vorhängen und goldenen Lichtkegeln.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08060a"/>
      <stop offset="0.5" stop-color="#1d0b1b"/>
      <stop offset="1" stop-color="#07070b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="18%" r="72%">
      <stop offset="0" stop-color="#e3c27b" stop-opacity=".42"/>
      <stop offset=".4" stop-color="#9f567d" stop-opacity=".22"/>
      <stop offset="1" stop-color="#07070b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9e8b7" stop-opacity=".44"/>
      <stop offset="1" stop-color="#f9e8b7" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <pattern id="grain" width="180" height="180" patternUnits="userSpaceOnUse">
      <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/></filter>
      <rect width="180" height="180" filter="url(#noise)" opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1600" height="1100" fill="url(#bg)"/>
  <rect width="1600" height="1100" fill="url(#glow)"/>
  <path d="M0 0h320c80 260 95 560 20 1100H0z" fill="#12060f"/>
  <path d="M1600 0h-320c-80 260-95 560-20 1100h340z" fill="#12060f"/>
  <path d="M475 0l190 0 145 760-430 0z" fill="url(#beam)" filter="url(#blur)"/>
  <path d="M935 0l190 0 95 760-430 0z" fill="url(#beam)" filter="url(#blur)" opacity=".78"/>
  <ellipse cx="800" cy="920" rx="480" ry="115" fill="#cda65c" opacity=".12" filter="url(#blur)"/>
  <circle cx="800" cy="650" r="150" fill="none" stroke="#d7b768" stroke-width="4" opacity=".25"/>
  <path d="M800 500c-70 80-110 185-110 315M800 500c70 80 110 185 110 315" fill="none" stroke="#eee4d8" stroke-width="3" opacity=".18"/>
  <rect width="1600" height="1100" fill="url(#grain)"/>
  <g fill="#f2e9df" text-anchor="middle">
    <text x="800" y="970" font-family="Georgia,serif" font-size="34" letter-spacing="9" opacity=".72">IMAGE PLACEHOLDER</text>
    <text x="800" y="1018" font-family="Arial,sans-serif" font-size="16" letter-spacing="5" opacity=".45">BÜHNEN- ODER EVENTFOTO EINFÜGEN</text>
  </g>
</svg>
